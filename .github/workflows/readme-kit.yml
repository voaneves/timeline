name: readme-kit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    name: Contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voaneves/dtcg-contrast@v1
        with:
          config: .github/readme-kit/contrast.config.json
          fail-on-error: true
          summary: true
