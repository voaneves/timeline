<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-hidden="true" class="vn-map-svg">
  <rect x="0" y="0" width="640" height="480" fill="#f4ead4" />
  <!-- Cordel / woodcut double frame -->
  <rect x="10" y="10" width="620" height="460" fill="none" stroke="#0a0a0a" stroke-width="4" />
  <rect x="18" y="18" width="604" height="444" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-dasharray="10 5" />

  <!-- Woodcut corner ornaments -->
  <path d="M18 42 L42 18 M18 30 L30 18 M598 18 L622 42 M610 18 L622 30 M18 438 L42 462 M18 450 L30 462 M598 462 L622 438 M610 462 L622 450" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="square" />

  <!-- Woodcut sunburst rays from central End-Dot -->
  <g stroke="#0a0a0a" stroke-width="1.2" opacity="0.18">
    <line x1="320" y1="240" x2="320" y2="36" />
    <line x1="320" y1="240" x2="470" y2="55" />
    <line x1="320" y1="240" x2="585" y2="155" />
    <line x1="320" y1="240" x2="595" y2="310" />
    <line x1="320" y1="240" x2="485" y2="430" />
    <line x1="320" y1="240" x2="320" y2="444" />
    <line x1="320" y1="240" x2="155" y2="430" />
    <line x1="320" y1="240" x2="45" y2="310" />
    <line x1="320" y1="240" x2="55" y2="155" />
    <line x1="320" y1="240" x2="170" y2="55" />
  </g>

  <!-- Outer woodcut guide ring -->
  <ellipse cx="320" cy="240" rx="224" ry="166" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55" />

  <!-- Red Line connecting the 7 zones in a ring -->
  <path d="M 320 77
           C 395 77, 465 98, 506 134
           C 548 172, 558 220, 538 269
           C 518 322, 482 368, 435 394
           C 372 426, 268 426, 205 394
           C 158 368, 122 322, 102 269
           C 82 220, 92 172, 134 134
           C 175 98, 245 77, 320 77 Z"
        fill="none" stroke="#0a0a0a" stroke-width="11" stroke-linejoin="round" />
  <path d="M 320 77
           C 395 77, 465 98, 506 134
           C 548 172, 558 220, 538 269
           C 518 322, 482 368, 435 394
           C 372 426, 268 426, 205 394
           C 158 368, 122 322, 102 269
           C 82 220, 92 172, 134 134
           C 175 98, 245 77, 320 77 Z"
        fill="none" stroke="#f50000" stroke-width="6" stroke-linejoin="round" />

  <!-- Spur from Hub / Ponto Final to central End-Dot -->
  <line x1="134" y1="134" x2="320" y2="240" stroke="#0a0a0a" stroke-width="7" stroke-linecap="round" />
  <line x1="134" y1="134" x2="320" y2="240" stroke="#f50000" stroke-width="3.5" stroke-linecap="round" />

  <!-- Central End-Dot -->
  <circle cx="320" cy="240" r="34" fill="#f4ead4" stroke="#0a0a0a" stroke-width="4" />
  <circle cx="320" cy="240" r="24" fill="#f50000" stroke="#0a0a0a" stroke-width="3" />
  <circle cx="320" cy="240" r="7" fill="#0a0a0a" />
  <text x="320" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2" fill="#0a0a0a">PONTO FINAL</text>

  <!-- 7 Station Woodcut Nodes -->
  <g fill="#f4ead4" stroke="#0a0a0a" stroke-width="3">
    <circle cx="320" cy="77" r="10" />
    <circle cx="506" cy="134" r="10" />
    <circle cx="538" cy="269" r="10" />
    <circle cx="435" cy="394" r="10" />
    <circle cx="205" cy="394" r="10" />
    <circle cx="102" cy="269" r="10" />
    <circle cx="134" cy="134" r="10" />
  </g>
  <g fill="#f50000">
    <circle cx="320" cy="77" r="4" />
    <circle cx="506" cy="134" r="4" />
    <circle cx="538" cy="269" r="4" />
    <circle cx="435" cy="394" r="4" />
    <circle cx="205" cy="394" r="4" />
    <circle cx="102" cy="269" r="4" />
    <circle cx="134" cy="134" r="4" />
  </g>
</svg>
